appId: com.diogo.counter
productName: Counter
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# Sem assinatura de código: o SmartScreen avisa no primeiro download manual,
# mas o auto-update segue funcionando (o updater baixa por fora do navegador e
# a instalação é por usuário, sem UAC).
publish:
  provider: github
  owner: diogolorenzo
  repo: blackjack-counter
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
