appId: com.diogo.counter
productName: Counter
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# Uso local: sem assinatura de código, sem auto-update, sem publish.
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
