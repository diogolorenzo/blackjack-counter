name: Release

# Publica no merge para main. O gatilho é a `version` do package.json: se ainda
# não existe release com a tag dela, este workflow empacota e publica. Um ajuste
# que não mexe na versão não vira release — e não deveria: o electron-updater só
# oferece atualização para uma versão MAIOR que a instalada, então republicar a
# mesma versão não avisaria ninguém.
#
# É a automação do procedimento manual descrito no README, armadilha do
# rascunho incluída.
on:
  push:
    branches: [main]
  # Escape hatch: republicar uma versão cujo build falhou, sem commit vazio.
  workflow_dispatch:

# Duas execuções da mesma versão em paralelo disputariam o mesmo latest.yml.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    # electron-builder e o gh sobem artefatos e editam a release.
    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Versão do package.json
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # A release PUBLICADA é o registro de que aquela versão saiu. Sem esta
      # guarda, todo push para main tentaria republicar a mesma versão e o
      # electron-builder falharia ao subir um artefato que já está lá.
      #
      # Rascunho não conta como publicada — é o rastro de uma execução que
      # morreu no meio, e `gh release view` não distingue os dois sozinho. Sem
      # olhar o isDraft, o workflow_dispatch que existe justamente para
      # reprocessar essa falha veria a release e pularia tudo, deixando o
      # rascunho encalhado para limpeza manual.
      - name: A versão já foi publicada?
        id: published
        shell: bash
        env:
          TAG: v${{ steps.version.outputs.value }}
        run: |
          estado=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo ausente)

          case "$estado" in
            false)
              echo "Release $TAG já publicada; nada a fazer."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "draft=false" >> "$GITHUB_OUTPUT"
              ;;
            true)
              echo "Rascunho de $TAG encalhado de uma execução anterior; reaproveitando."
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "draft=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "draft=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Mesma verificação do CI. Uma release quebrada chega sozinha ao usuário
      # pelo auto-update, então ela roda aqui também, não só no PR.
      - name: Testes
        if: steps.published.outputs.skip == 'false'
        run: npm test

      # O rascunho vem antes de propósito: se a release não existir, cada
      # publisher do electron-builder cria uma própria com a mesma tag e sobram
      # dois rascunhos incompletos — um com o .exe, outro só com o .blockmap — e
      # o auto-update quebra. Com o rascunho pronto, todos escrevem no mesmo
      # lugar. Rascunho também esconde a release enquanto os artefatos sobem:
      # nenhum app instalado enxerga uma versão pela metade.
      #
      # Pulado quando já existe um rascunho: nesse caso ele é reaproveitado, e
      # o electron-builder substitui os artefatos que porventura subiram antes
      # da falha.
      - name: Cria a release como rascunho
        if: steps.published.outputs.skip == 'false' && steps.published.outputs.draft == 'false'
        shell: bash
        env:
          TAG: v${{ steps.version.outputs.value }}
          TITLE: ${{ steps.version.outputs.value }}
        run: gh release create "$TAG" --draft --title "$TITLE" --generate-notes --repo "$GITHUB_REPOSITORY"

      # Sobe o .exe, o .blockmap (download diferencial) e o latest.yml — este
      # último é o arquivo que os apps instalados leem para descobrir que existe
      # versão nova. Sem os três, o auto-update não enxerga a release.
      - name: Empacota e sobe os artefatos
        if: steps.published.outputs.skip == 'false'
        run: npm run build:win -- --publish always

      # Enquanto for rascunho, nenhum app instalado enxerga a atualização.
      - name: Publica
        if: steps.published.outputs.skip == 'false'
        shell: bash
        env:
          TAG: v${{ steps.version.outputs.value }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
